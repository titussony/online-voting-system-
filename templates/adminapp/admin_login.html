{% extends 'base.html' %}

{% block title %}
Admin Login | ProjectVote
{% endblock %}

{% block content %}

<div class="container">

    <h1>ProjectVote Admin Login</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div>
            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >
        </div>

        <br>

        <div>
            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
